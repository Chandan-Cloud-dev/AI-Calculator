<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A modern calculator built with HTML, CSS and JavaScript" />
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">

    <!-- Display area -->
    <section class="display" aria-live="polite">
      <div id="previous" class="display-previous"></div>
      <div id="current" class="display-current">0</div>
    </section>

    <!-- Buttons -->
    <section class="buttons">
      <button class="btn function" data-action="clear" aria-label="Clear all">AC</button>
      <button class="btn function" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="btn function" data-action="percent" aria-label="Percentage">%</button>
      <button class="btn operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>

      <button class="btn" data-action="digit" data-value="7">7</button>
      <button class="btn" data-action="digit" data-value="8">8</button>
      <button class="btn" data-action="digit" data-value="9">9</button>
      <button class="btn operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

      <button class="btn" data-action="digit" data-value="4">4</button>
      <button class="btn" data-action="digit" data-value="5">5</button>
      <button class="btn" data-action="digit" data-value="6">6</button>
      <button class="btn operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <button class="btn" data-action="digit" data-value="1">1</button>
      <button class="btn" data-action="digit" data-value="2">2</button>
      <button class="btn" data-action="digit" data-value="3">3</button>
      <button class="btn operator" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button class="btn" data-action="sign" aria-label="Positive or negative">±</button>
      <button class="btn" data-action="digit" data-value="0">0</button>
      <button class="btn" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="btn equals" data-action="equals" aria-label="Equals">=</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
